<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sherozi Residence</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <header class="brand panel">
      <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div>
        <div class="brand-name">Sherozi Residence</div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </header>
    <div id="lang" class="panel"></div>

    <nav id="floors" class="panel"></nav>
    <aside id="side" class="panel"></aside>
    <div id="views" class="panel"></div>
    <div id="hint"></div>
    <div id="tooltip"></div>
    <div id="street-ui" hidden>
      <button id="exit-street" class="panel"></button>
      <div id="street-help" class="panel"></div>
      <div id="joystick"><div class="knob"></div></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
